[pytest]
markers =
    dbc: DBC load/decode/encode
    backend: TX parsing, virtual bus plumbing
    exporter: CSV/ASC export
    theme: light/dark/system themes
    worker: RX worker filtering
    trace: start/stop, RX rows, filter, clear, log
    decode: DBC columns in the trace
    tx: manual/DBC single-shot and cyclic TX
    entries: multi-message entry table
    failsafe: error-state behavior (no modals, auto-stop, batching)
    ui: window size, tabs, autoscroll
